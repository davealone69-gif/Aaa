name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android and SDK tests
        run: ./gradlew test
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: Worker syntax and contract tests
        run: |
          python3 -m py_compile worker/local_bridge.py
          python3 worker/test_unavailable_state.py
          python3 worker/test_video_unavailable.py
